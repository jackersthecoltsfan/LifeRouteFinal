name: LifeRoute Actions Queue Force Reset
run-name: Force reset LifeRoute Actions queue

on:
  push:
    branches: [chatgpt-release]
    paths:
      - '.github/workflows/actions-queue-reset.yml'

permissions:
  actions: write
  contents: read

jobs:
  force-reset:
    if: github.actor == github.repository_owner && github.event.head_commit.message == 'Force reset LifeRoute Actions queue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Force-cancel known zombie runs
        run: |
          set -euo pipefail
          RUN_IDS=(
            32986021087
            32985943850
            32985832208
            32984466479
            32984341439
          )
          for run_id in "${RUN_IDS[@]}"; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo missing)
            echo "Run ${run_id} before force-cancel: ${status}"
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
              echo "Force-cancelling ${run_id}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1 || true
            fi
          done

      - name: Wait for zombie runs to clear
        run: |
          set -euo pipefail
          RUN_IDS=(32986021087 32985943850 32985832208 32984466479 32984341439)
          for attempt in $(seq 1 60); do
            remaining=0
            for run_id in "${RUN_IDS[@]}"; do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo missing)
              echo "attempt=${attempt} run=${run_id} status=${status}"
              if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
                remaining=$((remaining + 1))
              fi
            done
            if [ "$remaining" -eq 0 ]; then
              echo "All known zombie runs cleared."
              exit 0
            fi
            sleep 3
          done
          echo "Some runs still have not cleared after force-cancel."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### LifeRoute Actions force reset"
            echo "Force-cancel was sent only to the five known stale workflow runs."
            echo "No application code or TestFlight release was triggered by this helper."
          } >> "$GITHUB_STEP_SUMMARY"
