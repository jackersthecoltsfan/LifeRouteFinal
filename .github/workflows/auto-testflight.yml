name: TestFlight Manual Release Policy
run-name: TestFlight remains manual-only

# LifeRoute policy: validation may run automatically, but TestFlight upload must
# NEVER be dispatched automatically. Use the dedicated "Send to TestFlight"
# workflow only after Brandon explicitly confirms a release run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm manual-only TestFlight policy
        run: |
          echo "LifeRoute TestFlight uploads are manual-only."
          echo "This workflow does not dispatch or upload a build."
          echo "Run .github/workflows/testflight.yml only after explicit user confirmation."
