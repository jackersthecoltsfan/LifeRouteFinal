name: Auto TestFlight After CI
run-name: Auto TestFlight · ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["iOS Build Check"]
    types: [completed]

permissions:
  actions: write
  contents: read

# Only one dispatcher is useful. If main moves again, the newer successful CI
# run becomes the release candidate instead.
concurrency:
  group: liferoute-auto-testflight
  cancel-in-progress: true

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send latest validated main to TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Avoid releasing an older commit when another update reached main
          # while this workflow was starting. The newer CI run will take over.
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [ "$CURRENT_SHA" != "$VALIDATED_SHA" ]; then
            echo "Skipping older validated commit $VALIDATED_SHA; main is now $CURRENT_SHA."
            exit 0
          fi

          echo "iOS Build Check passed for $VALIDATED_SHA. Starting TestFlight automatically."
          gh workflow run testflight.yml --repo "$GITHUB_REPOSITORY" --ref main
