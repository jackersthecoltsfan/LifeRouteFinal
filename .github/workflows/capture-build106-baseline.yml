name: Capture Build 106 Canonical Baseline
run-name: Capture exact Build 106 materialization

on:
  push:
    branches:
      - chore/v0.8.0-build106-canonical-baseline
    paths:
      - '.github/workflows/capture-build106-baseline.yml'

permissions:
  contents: read

concurrency:
  group: liferoute-build106-canonical-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout exact trusted Build 106 source
        uses: actions/checkout@v7
        with:
          ref: 6aaf9ac5234acd3178701fe0f4494675833b84fd
          fetch-depth: 0

      - name: Verify immutable capture source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6aaf9ac5234acd3178701fe0f4494675833b84fd"
          test -z "$(git status --porcelain)"

      - name: Materialize Build 106 one final time
        run: |
          set -o pipefail
          start_seconds=$SECONDS
          bash scripts/prepare_build.sh 2>&1 | tee "$RUNNER_TEMP/build106-prepare.log"
          elapsed_seconds=$((SECONDS - start_seconds))
          printf 'OLD_PREPARE_SECONDS=%s\n' "$elapsed_seconds" | tee "$RUNNER_TEMP/build106-timing.txt"

      - name: Capture canonical source and equivalence evidence
        run: |
          set -euo pipefail
          git status --short > "$RUNNER_TEMP/build106-status.txt"
          git diff --binary -- LifeRoute LifeRoute.xcodeproj LifeRouteLiveActivityWidget > "$RUNNER_TEMP/build106-materialized.patch"
          git diff --stat -- LifeRoute LifeRoute.xcodeproj LifeRouteLiveActivityWidget > "$RUNNER_TEMP/build106-diff-stat.txt"
          tar -czf "$RUNNER_TEMP/build106-canonical-source.tar.gz" \
            LifeRoute \
            LifeRoute.xcodeproj \
            LifeRouteLiveActivityWidget
          shasum -a 256 "$RUNNER_TEMP/build106-canonical-source.tar.gz" > "$RUNNER_TEMP/build106-canonical-source.sha256"

      - name: Upload canonical capture
        uses: actions/upload-artifact@v6
        with:
          name: liferoute-build106-canonical-capture
          path: |
            ${{ runner.temp }}/build106-prepare.log
            ${{ runner.temp }}/build106-timing.txt
            ${{ runner.temp }}/build106-status.txt
            ${{ runner.temp }}/build106-materialized.patch
            ${{ runner.temp }}/build106-diff-stat.txt
            ${{ runner.temp }}/build106-canonical-source.tar.gz
            ${{ runner.temp }}/build106-canonical-source.sha256
          if-no-files-found: error
          retention-days: 14
