name: ChatGPT TestFlight Release Request
run-name: ChatGPT TestFlight request · #${{ github.event.issue.number }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

# This bridge is deliberately short-lived. ChatGPT/Codex must verify required
# validation before opening the release request; the workflow never occupies a
# runner while waiting for CI or Pages to finish.
concurrency:
  group: liferoute-chatgpt-testflight-request
  cancel-in-progress: false

jobs:
  release-request:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == format('LifeRoute TestFlight release @ {0}', github.sha) &&
      (github.event.issue.body == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES' ||
       github.event.issue.body == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES;REQUIRE_WEB_PREVIEW=YES')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      REQUEST_BODY: ${{ github.event.issue.body }}
      REQUEST_ISSUE: ${{ github.event.issue.number }}

    steps:
      - name: Confirm exact current main release source
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$CURRENT_SHA" = "$RELEASE_SHA" || {
            echo "Main changed after the release request was opened; refusing stale release."
            exit 1
          }
          echo "Explicit owner-authorized request targets current main $RELEASE_SHA."

      - name: Require completed release-equivalent iOS validation
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-ci.yml/runs?branch=main&event=push&per_page=50")
          FOUND=''

          while IFS=$'\t' read -r candidate_id candidate_sha; do
            [ -n "$candidate_id" ] || continue
            if [ "$candidate_sha" = "$RELEASE_SHA" ]; then
              FOUND="$candidate_id"
              break
            fi

            COMPARE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${candidate_sha}...${RELEASE_SHA}" 2>/dev/null || true)
            [ "$(jq -r '.merge_base_commit.sha // empty' <<<"${COMPARE:-{}}")" = "$candidate_sha" ] || continue

            SAFE=true
            while IFS= read -r file; do
              case "$file" in
                *.md|ReusableAppWorkflow/*|ReusableAppWorkflow/**/*|.github/workflows/chatgpt-testflight-request.yml|.github/workflows/testflight.yml|.github/workflows/policy-check.yml)
                  ;;
                *) SAFE=false; break ;;
              esac
            done < <(jq -r '.files[].filename' <<<"$COMPARE")
            [ "$SAFE" = true ] && { FOUND="$candidate_id"; break; }
          done < <(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | [.id, .head_sha] | @tsv' <<<"$RUNS")

          test -n "$FOUND" || {
            echo "No completed successful release-equivalent iOS Build Check exists. Refusing release without waiting."
            exit 1
          }
          echo "Using successful release-equivalent iOS Build Check $FOUND."

      - name: Require completed release-equivalent web preview
        if: env.REQUEST_BODY == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES;REQUIRE_WEB_PREVIEW=YES'
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=50")
          FOUND=''

          while IFS=$'\t' read -r candidate_id candidate_sha; do
            [ -n "$candidate_id" ] || continue
            if [ "$candidate_sha" = "$RELEASE_SHA" ]; then
              FOUND="$candidate_id"
              break
            fi

            COMPARE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${candidate_sha}...${RELEASE_SHA}" 2>/dev/null || true)
            [ "$(jq -r '.merge_base_commit.sha // empty' <<<"${COMPARE:-{}}")" = "$candidate_sha" ] || continue

            SAFE=true
            while IFS= read -r file; do
              case "$file" in
                *.md|ReusableAppWorkflow/*|ReusableAppWorkflow/**/*|.github/workflows/chatgpt-testflight-request.yml|.github/workflows/testflight.yml|.github/workflows/policy-check.yml)
                  ;;
                *) SAFE=false; break ;;
              esac
            done < <(jq -r '.files[].filename' <<<"$COMPARE")
            [ "$SAFE" = true ] && { FOUND="$candidate_id"; break; }
          done < <(jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | [.id, .head_sha] | @tsv' <<<"$RUNS")

          test -n "$FOUND" || {
            echo "No completed successful release-equivalent web preview exists. Refusing release without waiting."
            exit 1
          }
          echo "Using successful release-equivalent web preview $FOUND."

      - name: Reconfirm main before TestFlight
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$CURRENT_SHA" = "$RELEASE_SHA" || {
            echo "Main changed during authorization checks; refusing stale release."
            exit 1
          }

      - name: Dispatch exact-SHA Send to TestFlight
        run: |
          set -euo pipefail
          jq -n \
            --arg ref main \
            --arg sha "$RELEASE_SHA" \
            --arg issue "$REQUEST_ISSUE" \
            '{ref:$ref, inputs:{authorized_sha:$sha, request_issue:$issue}}' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/testflight.yml/dispatches" \
            --input -

          gh issue comment "$REQUEST_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Validated release request accepted for ${RELEASE_SHA}. Send to TestFlight was dispatched with an exact-SHA guard. Keep this issue open until the upload result is verified."
