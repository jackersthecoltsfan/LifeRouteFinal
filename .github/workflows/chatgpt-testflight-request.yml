name: ChatGPT TestFlight Release Request
run-name: ChatGPT TestFlight request · #${{ github.event.issue.number }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

# Normal pushes never reach TestFlight. This permanent bridge accepts only an
# exact repository-owner release request created after explicit user approval.
concurrency:
  group: liferoute-chatgpt-testflight-request
  cancel-in-progress: false

jobs:
  release-request:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == format('LifeRoute TestFlight release @ {0}', github.sha) &&
      (github.event.issue.body == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES' ||
       github.event.issue.body == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES;REQUIRE_WEB_PREVIEW=YES')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      REQUEST_BODY: ${{ github.event.issue.body }}
      REQUEST_ISSUE: ${{ github.event.issue.number }}

    steps:
      - name: Confirm exact current main release source
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$CURRENT_SHA" = "$RELEASE_SHA" || {
            echo "Main changed after the release request was opened; refusing stale release."
            exit 1
          }
          echo "Explicit owner-authorized request targets current main $RELEASE_SHA."

      - name: Wait for iOS Build Check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-ci.yml/runs?branch=main&event=push&head_sha=${RELEASE_SHA}&per_page=10")
            COUNT=$(jq '.workflow_runs | length' <<<"$RUNS")
            if [ "$COUNT" -eq 0 ]; then
              echo "iOS Build Check: no matching run yet."
              sleep 30
              continue
            fi

            STATUS=$(jq -r '.workflow_runs[0].status' <<<"$RUNS")
            CONCLUSION=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$RUNS")
            RUN_ID=$(jq -r '.workflow_runs[0].id' <<<"$RUNS")
            echo "iOS Build Check $RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"

            if [ "$STATUS" = 'completed' ]; then
              test "$CONCLUSION" = 'success' || {
                echo "iOS Build Check failed; refusing TestFlight dispatch."
                exit 1
              }
              echo "IOS_VALIDATION_RUN=$RUN_ID" >> "$GITHUB_ENV"
              break
            fi

            if [ "$attempt" -eq 180 ]; then
              echo "iOS Build Check did not complete within the release-request job window."
              exit 1
            fi
            sleep 30
          done

      - name: Wait for release-equivalent web preview when requested
        if: env.REQUEST_BODY == 'AUTHORIZED_TESTFLIGHT_RELEASE=YES;REQUIRE_WEB_PREVIEW=YES'
        run: |
          set -euo pipefail

          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&event=push&per_page=20")
          PAGES_RUN_ID=''
          PAGES_SHA=''

          while IFS=$'\t' read -r candidate_id candidate_sha; do
            [ -n "$candidate_id" ] || continue
            if [ "$candidate_sha" = "$RELEASE_SHA" ]; then
              PAGES_RUN_ID="$candidate_id"
              PAGES_SHA="$candidate_sha"
              break
            fi

            COMPARE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${candidate_sha}...${RELEASE_SHA}" 2>/dev/null || true)
            MERGE_BASE=$(jq -r '.merge_base_commit.sha // empty' <<<"${COMPARE:-{}}")
            [ "$MERGE_BASE" = "$candidate_sha" ] || continue

            SAFE=true
            while IFS= read -r file; do
              case "$file" in
                *.md|ReusableAppWorkflow/*|ReusableAppWorkflow/**/*|.github/workflows/chatgpt-testflight-request.yml)
                  ;;
                *)
                  SAFE=false
                  break
                  ;;
              esac
            done < <(jq -r '.files[].filename' <<<"$COMPARE")

            if [ "$SAFE" = true ]; then
              PAGES_RUN_ID="$candidate_id"
              PAGES_SHA="$candidate_sha"
              break
            fi
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"$RUNS")

          test -n "$PAGES_RUN_ID" || {
            echo "No release-equivalent Publish Web Preview run was found."
            exit 1
          }

          echo "Using release-equivalent web preview run $PAGES_RUN_ID at $PAGES_SHA."
          for attempt in $(seq 1 180); do
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}")
            STATUS=$(jq -r '.status' <<<"$RUN")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")
            echo "Publish Web Preview $PAGES_RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"

            if [ "$STATUS" = 'completed' ]; then
              test "$CONCLUSION" = 'success' || {
                echo "Publish Web Preview failed; refusing TestFlight dispatch."
                exit 1
              }
              echo "WEB_VALIDATION_RUN=$PAGES_RUN_ID" >> "$GITHUB_ENV"
              break
            fi

            if [ "$attempt" -eq 180 ]; then
              echo "Publish Web Preview did not complete within the release-request job window."
              exit 1
            fi
            sleep 30
          done

      - name: Reconfirm main before TestFlight
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          test "$CURRENT_SHA" = "$RELEASE_SHA" || {
            echo "Main changed while validation was running; refusing stale release."
            exit 1
          }

      - name: Dispatch Send to TestFlight
        id: dispatch
        run: |
          set -euo pipefail
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RESPONSE=$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/testflight.yml/dispatches" \
            -f ref=main 2>/dev/null || true)

          RUN_ID=$(jq -r '.workflow_run_id // empty' <<<"${RESPONSE:-{}}" 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            for attempt in $(seq 1 30); do
              RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/testflight.yml/runs?branch=main&event=workflow_dispatch&head_sha=${RELEASE_SHA}&per_page=10")
              RUN_ID=$(jq -r --arg before "$BEFORE" '.workflow_runs | map(select(.created_at >= $before)) | sort_by(.created_at) | last | .id // empty' <<<"$RUNS")
              [ -n "$RUN_ID" ] && break
              sleep 2
            done
          fi

          test -n "$RUN_ID" || {
            echo "TestFlight workflow dispatch did not produce a discoverable run."
            exit 1
          }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched Send to TestFlight run $RUN_ID for $RELEASE_SHA."

      - name: Verify TestFlight upload completed
        env:
          TESTFLIGHT_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TESTFLIGHT_RUN_ID}")
            STATUS=$(jq -r '.status' <<<"$RUN")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")
            RUN_NUMBER=$(jq -r '.run_number' <<<"$RUN")
            echo "Send to TestFlight #$RUN_NUMBER: status=$STATUS conclusion=${CONCLUSION:-pending}"

            if [ "$STATUS" = 'completed' ]; then
              test "$CONCLUSION" = 'success' || {
                echo "Send to TestFlight did not complete successfully."
                exit 1
              }

              JOBS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TESTFLIGHT_RUN_ID}/jobs?per_page=100")
              UPLOAD=$(jq -r '[.jobs[].steps[]? | select(.name == "Upload to TestFlight") | .conclusion] | first // empty' <<<"$JOBS")
              test "$UPLOAD" = 'success' || {
                echo "Workflow passed but exact Upload to TestFlight step was not successful."
                exit 1
              }

              echo "TESTFLIGHT_RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
              break
            fi

            if [ "$attempt" -eq 180 ]; then
              echo "Send to TestFlight did not complete within the release-request job window."
              exit 1
            fi
            sleep 30
          done

      - name: Close completed release request
        run: |
          set -euo pipefail
          gh issue close "$REQUEST_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "TestFlight upload succeeded in Send to TestFlight #${TESTFLIGHT_RUN_NUMBER}. Exact Upload to TestFlight step: success."
