name: iOS Build Check
run-name: LifeRoute build check · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'LifeRoute/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare v0.5.0 functional core
        run: bash scripts/prepare_build.sh

      - name: Audit v0.5.0 functional shell
        run: python3 scripts/audit_v0_5_0_functional_shell.py

      - name: Build LifeRoute for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project LifeRoute.xcodeproj \
            -scheme LifeRoute \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
