    branches: [main]
    paths:
      - 'LifeRoute/**'
      - 'LifeRouteLiveActivityWidget/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/prepare_build.sh'
      - 'scripts/validate_current.py'
      - 'scripts/validate_fast.sh'
      - 'scripts/validate_full.sh'
      - 'scripts/run_swift_contract_test.sh'
      - 'scripts/run_*_contract_tests.sh'
      - 'scripts/run_visual_support_persistence_tests.sh'
      - 'scripts/run_calendar_cross_provider_dedup_tests.sh'
      - 'scripts/run_apple_occurrence_identity_tests.sh'
      - 'scripts/run_session_note_refinement_tests.sh'
      - 'scripts/run_session_note_draft_persistence_tests.sh'
      - 'scripts/run_living_theme_tests.sh'
      - 'scripts/*_contract_tests.swift'
      - 'scripts/visual_support_persistence_tests.swift'
      - 'scripts/calendar_cross_provider_dedup_tests.swift'
      - 'scripts/apple_occurrence_identity_seams.py'
      - 'scripts/apple_occurrence_identity_tests.swift'
      - 'scripts/session_note_contract_tests.swift'
      - 'scripts/session_note_refinement_tests.swift'
      - 'scripts/session_note_draft_persistence_tests.swift'
      - 'scripts/visual_support_prompt_contract_tests.swift'
      - 'scripts/day_route_contract_tests.swift'
      - 'scripts/calendar_edit_contract_tests.swift'
      - 'scripts/visual_timer_feedback_contract_tests.swift'
      - 'scripts/visual_timer_orb_region_tests.swift'
      - 'scripts/visual_timer_v04_material_tests.swift'
      - 'scripts/run_visual_timer_presentation_tests.py'
      - 'scripts/runtime_feedback_contract_tests.swift'
      - 'scripts/scenery_effect_contract_tests.swift'
      - 'scripts/visual_activity_contract_tests.swift'
      - 'scripts/living_theme_tests.swift'
      - 'scripts/run_simulator_smoke.sh'
      - 'scripts/root_paging_ambient_suspension_contract_test.py'
      - 'scripts/today_full_route_action_contract_test.py'
      - 'scripts/theme_thumbnail_contract_test.py'
      - 'scripts/assess_xcode_warnings.py'
      - 'scripts/liferoute_storage.py'
      - 'scripts/liferoute_storage_contract_tests.py'
      - 'ReusableAppWorkflow/ios-ci.template.yml'
      - 'ReusableAppWorkflow/testflight.template.yml'
      - '.github/workflows/policy-check.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/testflight.yml'
      - '.github/workflows/chatgpt-testflight-request.yml'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'LifeRoute/**'
      - 'LifeRouteLiveActivityWidget/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/prepare_build.sh'
      - 'scripts/validate_current.py'
      - 'scripts/validate_fast.sh'
      - 'scripts/validate_full.sh'
      - 'scripts/run_swift_contract_test.sh'
      - 'scripts/run_*_contract_tests.sh'
      - 'scripts/run_visual_support_persistence_tests.sh'
      - 'scripts/run_calendar_cross_provider_dedup_tests.sh'
      - 'scripts/run_apple_occurrence_identity_tests.sh'
      - 'scripts/run_session_note_refinement_tests.sh'
      - 'scripts/run_session_note_draft_persistence_tests.sh'
      - 'scripts/run_living_theme_tests.sh'
      - 'scripts/*_contract_tests.swift'
      - 'scripts/visual_support_persistence_tests.swift'
      - 'scripts/calendar_cross_provider_dedup_tests.swift'
      - 'scripts/apple_occurrence_identity_seams.py'
      - 'scripts/apple_occurrence_identity_tests.swift'
      - 'scripts/session_note_contract_tests.swift'
      - 'scripts/session_note_refinement_tests.swift'
      - 'scripts/session_note_draft_persistence_tests.swift'
      - 'scripts/visual_support_prompt_contract_tests.swift'
      - 'scripts/day_route_contract_tests.swift'
      - 'scripts/calendar_edit_contract_tests.swift'
      - 'scripts/visual_timer_feedback_contract_tests.swift'
      - 'scripts/visual_timer_orb_region_tests.swift'
      - 'scripts/visual_timer_v04_material_tests.swift'
      - 'scripts/run_visual_timer_presentation_tests.py'
      - 'scripts/runtime_feedback_contract_tests.swift'
      - 'scripts/scenery_effect_contract_tests.swift'
      - 'scripts/visual_activity_contract_tests.swift'
      - 'scripts/living_theme_tests.swift'
      - 'scripts/run_simulator_smoke.sh'
      - 'scripts/root_paging_ambient_suspension_contract_test.py'
      - 'scripts/today_full_route_action_contract_test.py'
      - 'scripts/theme_thumbnail_contract_test.py'
      - 'scripts/assess_xcode_warnings.py'
      - 'scripts/liferoute_storage.py'
      - 'scripts/liferoute_storage_contract_tests.py'
      - 'ReusableAppWorkflow/ios-ci.template.yml'
      - 'ReusableAppWorkflow/testflight.template.yml'
      - '.github/workflows/policy-check.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/testflight.yml'
      - '.github/workflows/chatgpt-testflight-request.yml'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-validation:
    name: Current semantic validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare canonical source
        run: |
          start=$SECONDS
          bash scripts/prepare_build.sh
          echo "prepare_build_seconds=$((SECONDS-start))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run storage scratch/evidence contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/liferoute_storage_contract_tests.py

      - name: Run fast validation
        run: |
          start=$SECONDS
          bash scripts/validate_fast.sh
          echo "validate_fast_seconds=$((SECONDS-start))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run full validation
        run: |
          start=$SECONDS
          bash scripts/validate_full.sh
          echo "validate_full_seconds=$((SECONDS-start))" | tee -a "$GITHUB_STEP_SUMMARY"

  native-validation:
    name: Debug, Release, extension, and Simulator
    needs: current-validation
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare canonical source
        run: bash scripts/prepare_build.sh

      - name: Prepare reusable LifeRoute build scratch
        run: |
          set -euo pipefail
          scratch_root="$(python3 scripts/liferoute_storage.py scratch-root)"
          build_root="$scratch_root/LifeRoute/ios-ci"
          mkdir -p "$build_root"
          echo "LIFEROUTE_BUILD_SCRATCH_ROOT=$build_root" >> "$GITHUB_ENV"

      - name: Run SwiftUI Visual Timer feedback contract
        run: bash scripts/run_visual_timer_feedback_contract_tests.sh

      - name: Run Apple-framework semantic contracts
        run: |
          command -v swiftc >/dev/null
          bash scripts/run_visual_activity_contract_tests.sh
          bash scripts/run_living_theme_tests.sh

      - name: Debug-equivalent app and extension compile
        run: |
          set -o pipefail
          xcodebuild \
            -project LifeRoute.xcodeproj \
            -scheme LifeRoute \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$LIFEROUTE_BUILD_SCRATCH_ROOT/Debug-iphonesimulator" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/liferoute-debug.log"

      - name: Release-equivalent app and extension compile
        run: |
          set -o pipefail
          xcodebuild \
            -project LifeRoute.xcodeproj \
            -scheme LifeRoute \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$LIFEROUTE_BUILD_SCRATCH_ROOT/Release-iphonesimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/liferoute-release.log"

      - name: Run native Simulator smoke
        run: |
          bash scripts/run_simulator_smoke.sh \
            "$LIFEROUTE_BUILD_SCRATCH_ROOT/Debug-iphonesimulator/Build/Products/Debug-iphonesimulator/LifeRoute.app" \
            "$RUNNER_TEMP/liferoute-simulator-smoke"

      - name: Enforce compiler warning budget
        if: always()
        run: |
          set -o pipefail
          python3 scripts/assess_xcode_warnings.py \
            "$RUNNER_TEMP/liferoute-debug.log" \
            "$RUNNER_TEMP/liferoute-release.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: liferoute-current-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/liferoute-debug.log
            ${{ runner.temp }}/liferoute-release.log
            ${{ runner.temp }}/liferoute-simulator-smoke/**
          if-no-files-found: warn
          retention-days: 14
