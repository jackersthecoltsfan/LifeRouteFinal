name: iOS Build Check
run-name: LifeRoute build check · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/**'
      - 'LifeRouteShared/**'
      - 'LifeRouteLiveActivity/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '!scripts/audit_release_isolation.py'
      - '!scripts/audit_workflow_efficiency.py'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'LifeRoute/**'
      - 'LifeRouteShared/**'
      - 'LifeRouteLiveActivity/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '!scripts/audit_release_isolation.py'
      - '!scripts/audit_workflow_efficiency.py'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation for the same workflow/ref. Using the workflow
# name in the key prevents an unrelated workflow from sharing this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the same features used by TestFlight
        run: bash scripts/prepare_build.sh

      - name: Full LifeRoute regression audit
        run: python3 scripts/audit_liferoute_build.py

      - name: Build LifeRoute for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project LifeRoute.xcodeproj \
            -scheme LifeRoute \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
