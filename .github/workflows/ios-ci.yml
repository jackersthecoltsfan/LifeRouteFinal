name: iOS Build Check
run-name: LifeRoute build check · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '!scripts/audit_release_isolation.py'
      - '!scripts/audit_workflow_efficiency.py'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'LifeRoute/**'
      - 'LifeRoute.xcodeproj/**'
      - 'scripts/**'
      - '!scripts/audit_release_isolation.py'
      - '!scripts/audit_workflow_efficiency.py'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    # The isolated v0.7.1 theme branch boots a cold iOS Simulator and captures the complete
    # twenty-theme matrix. GitHub's macOS 26 image can spend ~5 minutes in first-boot migration.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare v0.5.0 functional core
        run: bash scripts/prepare_build.sh
      - name: Audit checkpoint 03F client visual supports
        run: python3 scripts/audit_v0_5_0_client_visual_supports.py
      - name: Audit checkpoint 04A client visual persistence
        run: python3 scripts/audit_v0_5_0_client_visual_persistence.py
      - name: Audit checkpoint 04B routing calendar persistence
        run: python3 scripts/audit_v0_5_0_routing_calendar_persistence.py
      - name: Audit checkpoint 04C legacy migration
        run: python3 scripts/audit_v0_5_0_legacy_migration.py
      - name: Audit checkpoint 05A performance architecture
        run: python3 scripts/audit_v0_5_0_performance_architecture.py
      - name: Audit checkpoint 06 stability architecture
        run: python3 scripts/audit_v0_5_0_stability_architecture.py
      - name: Audit checkpoint 07 second functionality pass
        run: python3 scripts/audit_v0_5_0_second_functionality_pass.py
      - name: Build LifeRoute for iOS Simulator
        run: |
          set -uo pipefail
          LOG_FILE="$RUNNER_TEMP/liferoute-xcodebuild.log"
          set +e
          xcodebuild \
            -project LifeRoute.xcodeproj \
            -scheme LifeRoute \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/liferoute-derived-data" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGNING_ALLOWED=NO \
            build >"$LOG_FILE" 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "Xcode build failed. Compiler diagnostics:"
            diagnostics="$(grep -E '(^|[[:space:]])(error|fatal error):|:[0-9]+:[0-9]+: error:' "$LOG_FILE" | head -80 || true)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(tail -120 "$LOG_FILE")"
            fi
            printf '%s\n' "$diagnostics"
            while IFS= read -r diagnostic; do
              [ -n "$diagnostic" ] && echo "::error::$diagnostic"
            done <<< "$diagnostics"
            exit "$status"
          fi

          tail -40 "$LOG_FILE"
      - name: Capture v0.7.1 visual fixtures
        if: >-
          (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/v0.7.1-theme-runtime-visual-regression') ||
          (github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/v0.7.1-theme-library-finish-codex') ||
          (github.event_name == 'pull_request' && github.head_ref == 'fix/v0.7.1-theme-runtime-visual-regression')
        run: |
          bash scripts/capture_v0_7_1_visual_fixtures.sh \
            "$RUNNER_TEMP/liferoute-derived-data/Build/Products/Debug-iphonesimulator/LifeRoute.app" \
            "$RUNNER_TEMP/liferoute-visual-validation"
      - name: Upload v0.7.1 visual fixtures
        if: >-
          always() && (
            (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/v0.7.1-theme-runtime-visual-regression') ||
            (github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/v0.7.1-theme-library-finish-codex') ||
            (github.event_name == 'pull_request' && github.head_ref == 'fix/v0.7.1-theme-runtime-visual-regression')
          )
        uses: actions/upload-artifact@v6
        with:
          name: liferoute-v0.7.1-theme-matrix
          path: ${{ runner.temp }}/liferoute-visual-validation/**
          if-no-files-found: error
          retention-days: 14
