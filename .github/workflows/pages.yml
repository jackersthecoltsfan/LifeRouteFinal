name: Publish Web Preview
run-name: LifeRoute web preview

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/**'
      - '!scripts/audit_release_isolation.py'
      - '!scripts/audit_workflow_efficiency.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest preview for this workflow/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # prepare_build.sh already runs the deep shared runtime/state/stability audits.
    # Keep only independent web-specific checks here to avoid running the same
    # audits twice on an expensive macOS runner.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare exact current LifeRoute build
        run: bash scripts/prepare_build.sh

      - name: Full LifeRoute regression audit
        run: python3 scripts/audit_liferoute_build.py

      - name: Web-specific interaction audits
        run: |
          python3 scripts/audit_touch_playground_v1.py
          python3 scripts/audit_immersion_ui_v1.py
          python3 scripts/audit_nav_portal_v1.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build browser preview
        run: python3 scripts/build_web_preview.py

      - name: Audit final browser artifact
        run: python3 scripts/audit_web_artifact.py

      - name: Report browser artifact budget
        run: |
          echo "### LifeRoute web artifact" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          find dist -type f | wc -l | awk '{print "Files: "$1}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
