name: Publish Web Preview
run-name: LifeRoute web preview

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: liferoute-pages
  cancel-in-progress: true

jobs:
  build:
    # Build the Pages preview from the exact same prepared source used by TestFlight.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare exact current LifeRoute build
        run: bash scripts/prepare_build.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build browser preview
        run: |
          set -euo pipefail
          rm -rf dist
          cp -R LifeRoute/Web dist
          cp scripts/web-preview.js dist/web-preview.js
          touch dist/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          path = Path("dist/index.html")
          html = path.read_text()
          tag = '<script src="web-preview.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not build Pages preview: </body> not found")
              html = html.replace("</body>", tag + "\n</body>", 1)
          path.write_text(html)
          PY

          # Pages must expose the same feature surface prepared for TestFlight.
          for js in icons.js route-times.js smart-context.js todos.js grocery-stores.js transport-mode.js sleek-ui.js store-sleek-ui.js selected-gap-routes.js live-day.js rbt-tools.js pecs-tools.js live-themes.js web-preview.js; do
            test -s "dist/$js"
            node --check "dist/$js"
          done
          grep -q 'rbt-tools.js' dist/index.html
          grep -q 'pecs-tools.js' dist/index.html
          grep -q 'live-themes.js' dist/index.html
          grep -q 'selected-gap-routes.js' dist/index.html
          grep -q 'web-preview.js' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
