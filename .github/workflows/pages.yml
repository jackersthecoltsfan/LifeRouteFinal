name: Publish Web Preview
run-name: LifeRoute web preview

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: liferoute-pages
  cancel-in-progress: true

jobs:
  build:
    # Build the Pages preview from the exact same prepared source used by TestFlight.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare exact current LifeRoute build
        run: bash scripts/prepare_build.sh

      - name: Full LifeRoute regression audit
        run: python3 scripts/audit_liferoute_build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build browser preview
        run: |
          set -euo pipefail
          rm -rf dist
          cp -R LifeRoute/Web dist
          cp scripts/web-preview.js dist/web-preview.js
          touch dist/.nojekyll

          BUILD_SHA="$GITHUB_SHA" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("dist/index.html")
          html = path.read_text()
          sha = os.environ["BUILD_SHA"][:8]

          tag = '<script src="web-preview.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not build Pages preview: </body> not found")
              html = html.replace("</body>", tag + "\n</body>", 1)

          # Safari can keep an older JavaScript file even after Pages deploys.
          # Give every local script a commit-specific URL so each preview loads
          # the exact code from the newest GitHub Pages deployment.
          html = re.sub(
              r'<script src="([^"]+\.js)(?:\?[^"]*)?"></script>',
              lambda m: f'<script src="{m.group(1)}?v={sha}"></script>',
              html
          )

          marker = f'<meta name="liferoute-web-build" content="{sha}">'
          if "</head>" in html and "liferoute-web-build" not in html:
              html = html.replace("</head>", marker + "\n</head>", 1)

          path.write_text(html)
          PY

          # Validate every feature expected to ship in the current web experience.
          for js in \
            auth-gate.js icons.js route-times.js smart-context.js todos.js grocery-stores.js \
            transport-mode.js sleek-ui.js store-sleek-ui.js selected-gap-routes.js live-day.js \
            rbt-tools.js visual-resolver.js visual-tools.js visual-resolver-bridge.js live-themes.js \
            day-route-experience.js day-navigation-runtime.js boundary-stop-planner.js refined-ui-v2.js \
            welcome.js nav-cleanup.js icloud-calendar-web.js google-calendar-web.js \
            google-calendar-stability.js google-calendar-persistence-web.js first-then-back.js \
            visual-quality-web.js photo-source-picker-web.js end-home-route-web.js \
            mileage-tracker-web.js resources-hub-web.js nature-settings-web.js \
            settings-classic-themes-web.js photoreal-nature-web.js dynamic-themes-web.js \
            web-routing-bridge.js web-store-search-fallback.js web-preview.js; do
            test -s "dist/$js"
            node --check "dist/$js"
          done

          grep -q 'rbt-tools.js' dist/index.html
          grep -q 'visual-resolver.js' dist/index.html
          grep -q 'visual-tools.js' dist/index.html
          grep -q 'visual-resolver-bridge.js' dist/index.html
          grep -q 'live-themes.js' dist/index.html
          grep -q 'selected-gap-routes.js' dist/index.html
          grep -q 'day-route-experience.js' dist/index.html
          grep -q 'day-navigation-runtime.js' dist/index.html
          grep -q 'class="lrDayPager"' dist/index.html
          grep -q 'id="dayPrevButton"' dist/index.html
          grep -q 'id="dayTodayButton"' dist/index.html
          grep -q 'id="dayNextButton"' dist/index.html
          grep -q 'web-preview.js' dist/index.html

          grep -q 'shiftSelectedDayRuntime' dist/day-navigation-runtime.js
          grep -q 'dayNavBound' dist/day-navigation-runtime.js
          grep -q 'boundary-stop-planner.js' dist/day-navigation-runtime.js
          grep -q 'refined-ui-v2.js' dist/day-navigation-runtime.js
          grep -q 'liferoute_boundary_stops_v1' dist/boundary-stop-planner.js
          grep -q 'data-boundary-place' dist/boundary-stop-planner.js
          grep -q 'searchStoreLocations' dist/boundary-stop-planner.js
          grep -q 'web-routing-bridge.js' dist/web-preview.js
          grep -q 'web-store-search-fallback.js' dist/web-preview.js
          grep -q 'welcome.js' dist/web-preview.js
          grep -q 'google-calendar-persistence-web.js' dist/web-preview.js
          grep -q 'end-home-route-web.js' dist/web-preview.js
          grep -q 'mileage-tracker-web.js' dist/web-preview.js
          grep -q 'resources-hub-web.js' dist/web-preview.js
          grep -q 'nature-settings-web.js' dist/web-preview.js
          grep -q 'settings-classic-themes-web.js' dist/web-preview.js
          grep -q 'photoreal-nature-web.js' dist/web-preview.js
          grep -q 'dynamic-themes-web.js' dist/web-preview.js

          grep -q 'requestRouteTimes' dist/web-routing-bridge.js
          grep -q 'searchStoreLocations' dist/web-routing-bridge.js
          grep -q 'requestCurrentLocation' dist/web-routing-bridge.js
          grep -q 'web-nominatim-fallback' dist/web-store-search-fallback.js
          grep -q 'lifeRouteChooseRouteOrigin' dist/day-route-experience.js
          grep -q 'BEFORE FIRST APPOINTMENT' dist/day-route-experience.js
          grep -q 'AFTER LAST APPOINTMENT' dist/day-route-experience.js
          grep -q 'icloud-calendar-web.js' dist/web-preview.js
          grep -q 'google-calendar-web.js' dist/web-preview.js
          grep -q 'calendar.readonly' dist/google-calendar-web.js
          grep -q 'apps.googleusercontent.com' dist/google-calendar-web.js
          grep -q 'Metallic Wave' dist/settings-classic-themes-web.js
          grep -q 'Scenery' dist/dynamic-themes-web.js
          grep -q 'Dynamic' dist/dynamic-themes-web.js
          grep -q 'Unsplash photography' dist/photoreal-nature-web.js
          ! grep -qi 'client_secret' dist/*.js
          ! grep -q 'PREVIEW_CODE' dist/auth-gate.js
          ! grep -q '246810' dist/auth-gate.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
