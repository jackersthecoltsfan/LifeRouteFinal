name: Publish Web Preview
run-name: LifeRoute web preview

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: liferoute-pages
  cancel-in-progress: true

jobs:
  build:
    # Pages is built from the exact same prepared source used by the native app,
    # but publishing the web build never dispatches TestFlight.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare exact current LifeRoute build
        run: bash scripts/prepare_build.sh

      - name: Audit 1 · Full LifeRoute regression
        run: python3 scripts/audit_liferoute_build.py

      - name: Audit 2 · Touch playground contracts
        run: python3 scripts/audit_touch_playground_v1.py

      - name: Audit 3 · JavaScript syntax sweep
        run: |
          node --check LifeRoute/Web/touch-playground-v1.js
          node --check LifeRoute/Web/delight-ui-v1.js
          node --check LifeRoute/Web/delight-tail-v1.js
          node --check LifeRoute/Web/aesthetic-polish-v1.js
          node --check LifeRoute/Web/timer-native-audio-v1.js
          node --check LifeRoute/Web/toolbar-cleanup-v1.js

      - name: Audit 4 · Interaction and performance pressure
        run: python3 scripts/audit_interaction_performance_v3.py

      - name: Audit 5 · Runtime stability
        run: python3 scripts/audit_stability.py

      - name: Audit 6 · Release lifecycle and pressure
        run: python3 scripts/audit_runtime_release.py

      - name: Audit 7 · State invariants and user journeys
        run: |
          python3 scripts/audit_state_invariants.py
          python3 scripts/audit_user_journeys.py

      - name: Audit 8 · Immersive UI safety and accessibility
        run: python3 scripts/audit_immersion_ui_v1.py

      - name: Audit 9 · Web versus TestFlight release isolation
        run: python3 scripts/audit_release_isolation.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build browser preview
        run: python3 scripts/build_web_preview.py

      - name: Audit 10 · Final browser artifact
        run: python3 scripts/audit_web_artifact.py

      - name: Report browser artifact budget
        run: |
          echo "### LifeRoute web artifact" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          find dist -type f | wc -l | awk '{print "Files: "$1}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
