name: Publish Web Preview
run-name: LifeRoute non-authoritative web preview

on:
  push:
    branches: [main]
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/build_web_preview.py'
      - 'scripts/web-preview.js'
      - 'scripts/validate_web_preview.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'LifeRoute/Web/**'
      - 'scripts/build_web_preview.py'
      - 'scripts/web-preview.js'
      - 'scripts/validate_web_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate canonical native boundary
        run: bash scripts/validate_fast.sh

      - name: Build browser preview
        run: python3 scripts/build_web_preview.py

      - name: Validate browser preview
        run: python3 scripts/validate_web_preview.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
