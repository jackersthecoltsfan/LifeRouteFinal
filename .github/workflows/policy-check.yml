name: Release Policy Check
run-name: LifeRoute current release policy check

on:
  push:
    branches: [main]
    paths:
      - 'TESTFLIGHT_SETUP.md'
      - 'APP_CREATION_PLAYBOOK.md'
      - 'GITHUB_ACTIONS_RUNBOOK.md'
      - 'scripts/validate_current.py'
      - 'scripts/validate_fast.sh'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'TESTFLIGHT_SETUP.md'
      - 'APP_CREATION_PLAYBOOK.md'
      - 'GITHUB_ACTIONS_RUNBOOK.md'
      - 'scripts/validate_current.py'
      - 'scripts/validate_fast.sh'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate current release policy
        run: bash scripts/validate_fast.sh
