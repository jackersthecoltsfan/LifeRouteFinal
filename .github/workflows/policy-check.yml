name: Release Policy Check
run-name: LifeRoute release policy check

on:
  push:
    branches: [main]
    paths:
      - 'TESTFLIGHT_SETUP.md'
      - 'APP_CREATION_PLAYBOOK.md'
      - 'scripts/audit_release_isolation.py'
      - 'scripts/audit_workflow_efficiency.py'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'TESTFLIGHT_SETUP.md'
      - 'APP_CREATION_PLAYBOOK.md'
      - 'scripts/audit_release_isolation.py'
      - 'scripts/audit_workflow_efficiency.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit release isolation
        run: python3 scripts/audit_release_isolation.py

      - name: Audit workflow efficiency
        run: python3 scripts/audit_workflow_efficiency.py
