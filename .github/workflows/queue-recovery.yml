name: LifeRoute queue recovery

on:
  push:
    branches:
      - queue-recovery-2026-08-26

permissions:
  contents: read

# One-shot outage recovery only. Sharing this concurrency group with the
# historical TestFlight workflow causes GitHub to replace an orphaned pending
# run without executing any release or upload steps.
concurrency:
  group: liferoute-testflight
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm queue recovery run
        run: echo "LifeRoute queue recovery no-op; no build, signing, or upload performed."
