name: One-Shot TestFlight Trial Dispatcher
run-name: Authorized one-shot TestFlight trial

# TEMPORARY one-shot dispatcher created only because the user explicitly
# commanded one TestFlight trial. It is guarded by the exact commit message and
# by this file path, and will be restored to the inert manual-only policy as soon
# as the dispatch fires.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-once:
    if: github.event.head_commit.message == 'Authorize one TestFlight trial [testflight-once]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch audited TestFlight workflow exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run testflight.yml --repo "${{ github.repository }}" --ref main
          echo "One explicit TestFlight trial dispatched."
