name: Authorized TestFlight Dispatch
run-name: Authorized one-shot TestFlight dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Authorize one TestFlight trial [testflight-once]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical TestFlight workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run testflight.yml --repo "${{ github.repository }}" --ref main
