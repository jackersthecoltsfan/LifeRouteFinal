name: Send to TestFlight
run-name: LifeRoute → TestFlight #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: Optional exact main SHA authorized by the guarded assistant bridge
        required: false
        type: string
      request_issue:
        description: Optional release-request issue number for traceability
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: liferoute-testflight
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SCHEME: LifeRoute
      PROJECT: LifeRoute.xcodeproj
      BUNDLE_ID: Com.Brandongood.LifeRoute
      LIVE_ACTIVITY_BUNDLE_ID: Com.Brandongood.LifeRoute.LiveDay
      RELEASE_MARKETING_VERSION: 0.6.2
      AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
      REQUEST_ISSUE: ${{ inputs.request_issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify authorized release source
        run: |
          set -euo pipefail
          if [ -n "$AUTHORIZED_SHA" ]; then
            test "$GITHUB_SHA" = "$AUTHORIZED_SHA" || {
              echo "Refusing release: dispatched SHA $GITHUB_SHA does not match authorized SHA $AUTHORIZED_SHA."
              exit 1
            }
            echo "Exact-SHA release guard passed for $AUTHORIZED_SHA (request issue ${REQUEST_ISSUE:-n/a})."
          else
            echo "Manual workflow dispatch: no assistant exact-SHA input supplied."
          fi

      - name: Prepare validated v0.6.2 release
        run: bash scripts/prepare_build.sh

      - name: Validate Apple connection
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "Missing APP_STORE_CONNECT_KEY_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || (echo "Missing APP_STORE_CONNECT_PRIVATE_KEY" && exit 1)

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_KEY_DIR"
          cp "$KEY_PATH" "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Remember existing Apple signing assets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby scripts/apple_ci_assets.rb snapshot "$RUNNER_TEMP/apple-signing-baseline.json"

      - name: Verify v0.6.2 app and Live Activity release contract
        run: |
          set -euo pipefail
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" LifeRoute.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${LIVE_ACTIVITY_BUNDLE_ID};" LifeRoute.xcodeproj/project.pbxproj
          test "$(grep -c 'MARKETING_VERSION =' LifeRoute.xcodeproj/project.pbxproj)" -ge 4
          grep -q 'LifeRouteLiveActivityWidget.appex in Embed App Extensions' LifeRoute.xcodeproj/project.pbxproj
          ! grep -q 'LifeRouteWebView.swift in Sources' LifeRoute.xcodeproj/project.pbxproj
          ! grep -q 'Web in Resources' LifeRoute.xcodeproj/project.pbxproj
          ICON="LifeRoute/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -s "$ICON"
          test "$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')" = "1024"
          echo "v0.6.2 app, refined premium LR icon, and Live Activity extension source contract are isolated and ready for signing."

      - name: Archive LifeRoute v0.6.2
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LifeRoute.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Verify archived v0.6.2 identity
        run: |
          set -euo pipefail
          APP_PLIST="build/LifeRoute.xcarchive/Products/Applications/LifeRoute.app/Info.plist"
          EXT_PLIST="build/LifeRoute.xcarchive/Products/Applications/LifeRoute.app/PlugIns/LifeRouteLiveActivityWidget.appex/Info.plist"
          test -f "$APP_PLIST"
          test -f "$EXT_PLIST"

          APP_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")
          APP_BUILD=$(plutil -extract CFBundleVersion raw -o - "$APP_PLIST")
          APP_BUNDLE=$(plutil -extract CFBundleIdentifier raw -o - "$APP_PLIST")
          EXT_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - "$EXT_PLIST")
          EXT_BUILD=$(plutil -extract CFBundleVersion raw -o - "$EXT_PLIST")
          EXT_BUNDLE=$(plutil -extract CFBundleIdentifier raw -o - "$EXT_PLIST")

          test "$APP_VERSION" = "$RELEASE_MARKETING_VERSION" || { echo "Wrong app marketing version: $APP_VERSION"; exit 1; }
          test "$EXT_VERSION" = "$RELEASE_MARKETING_VERSION" || { echo "Wrong extension marketing version: $EXT_VERSION"; exit 1; }
          test "$APP_BUILD" = "$GITHUB_RUN_NUMBER" || { echo "Wrong app build number: $APP_BUILD"; exit 1; }
          test "$EXT_BUILD" = "$GITHUB_RUN_NUMBER" || { echo "Wrong extension build number: $EXT_BUILD"; exit 1; }
          test "$APP_BUNDLE" = "$BUNDLE_ID" || { echo "Wrong app bundle ID: $APP_BUNDLE"; exit 1; }
          test "$EXT_BUNDLE" = "$LIVE_ACTIVITY_BUNDLE_ID" || { echo "Wrong extension bundle ID: $EXT_BUNDLE"; exit 1; }
          echo "Archive identity verified: LifeRoute ${APP_VERSION} (${APP_BUILD}) + Live Day extension."

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/LifeRoute.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' -print -quit)
          test -n "$IPA" || (echo "No IPA found" && exit 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          {
            echo "### ✅ LifeRoute v0.6.2 sent to TestFlight"
            echo "Build **#${GITHUB_RUN_NUMBER}** uploaded successfully."
            echo "Includes the accelerating visual timer, compact selected-client ABA note context, three-category theme catalog with animated Dynamic and six Scenery environments, plus the refined LR icon safe area."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: LifeRoute-v0.6.2-TestFlight-build-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean temporary Apple signing assets
        if: always()
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/apple-signing-baseline.json" ]; then
            ruby scripts/apple_ci_assets.rb cleanup "$RUNNER_TEMP/apple-signing-baseline.json"
          else
            echo "No Apple signing baseline was created, so there is nothing to clean."
          fi