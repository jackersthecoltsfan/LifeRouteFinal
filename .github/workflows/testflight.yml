name: Send to TestFlight
run-name: LifeRoute v0.8.3 exact-SHA TestFlight #${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      authorized_sha:
        description: Exact current main SHA explicitly authorized for TestFlight
        required: true
        type: string
      request_issue:
        description: Optional release-request issue number for traceability
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: liferoute-testflight
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      PROJECT: LifeRoute.xcodeproj
      SCHEME: LifeRoute
      BUNDLE_ID: Com.Brandongood.LifeRoute
      LIVE_ACTIVITY_BUNDLE_ID: Com.Brandongood.LifeRoute.LiveDay
      RELEASE_MARKETING_VERSION: 0.8.3
      AUTHORIZED_SHA: ${{ inputs.authorized_sha }}
      REQUEST_ISSUE: ${{ inputs.request_issue }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout authorized source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.authorized_sha }}
          fetch-depth: 0

      - name: Verify authorized release source
        run: |
          set -euo pipefail
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "authorized_sha must be a full lowercase commit SHA."
            exit 1
          }
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA" || {
            echo "Checked-out source does not match the authorized SHA."
            exit 1
          }
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_SHA" || {
            echo "Refusing release: authorized SHA is no longer exact current main."
            exit 1
          }
          echo "Exact-SHA authorization passed for $AUTHORIZED_SHA (request ${REQUEST_ISSUE:-manual})."

      - name: Require successful exact-SHA current validation
        run: |
          set -euo pipefail
          RUN_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq ".workflow_runs[] | select(.head_sha == \"$AUTHORIZED_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .id" \
            | head -1)
          test -n "$RUN_ID" || {
            echo "No successful exact-SHA iOS Current Baseline run exists for $AUTHORIZED_SHA."
            exit 1
          }
          echo "Exact-SHA current validation run: $RUN_ID"

      - name: Validate full current release contract and AppIcon
        run: bash scripts/validate_full.sh

      - name: Validate Apple connection
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

      - name: Prepare temporary App Store Connect key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_KEY_DIR"
          cp "$KEY_PATH" "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Remember existing Apple signing assets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ruby scripts/apple_ci_assets.rb snapshot "$RUNNER_TEMP/apple-signing-baseline.json"

      - name: Archive LifeRoute v0.8.3
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LifeRoute.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Verify archived LifeRoute v0.8.3 identity
        run: |
          set -euo pipefail
          APP_PLIST="build/LifeRoute.xcarchive/Products/Applications/LifeRoute.app/Info.plist"
          EXT_PLIST="build/LifeRoute.xcarchive/Products/Applications/LifeRoute.app/PlugIns/LifeRouteLiveActivityWidget.appex/Info.plist"
          test -f "$APP_PLIST"
          test -f "$EXT_PLIST"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")" = "$RELEASE_MARKETING_VERSION"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$EXT_PLIST")" = "$RELEASE_MARKETING_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP_PLIST")" = "$GITHUB_RUN_NUMBER"
          test "$(plutil -extract CFBundleVersion raw -o - "$EXT_PLIST")" = "$GITHUB_RUN_NUMBER"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP_PLIST")" = "$BUNDLE_ID"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$EXT_PLIST")" = "$LIVE_ACTIVITY_BUNDLE_ID"

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/LifeRoute.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: LifeRoute-v0.8.3-TestFlight-build-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean temporary Apple signing assets
        if: always()
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/apple-signing-baseline.json" ]; then
            ruby scripts/apple_ci_assets.rb cleanup "$RUNNER_TEMP/apple-signing-baseline.json"
          fi
          rm -f "${KEY_PATH:-}"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
