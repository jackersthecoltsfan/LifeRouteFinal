name: Send to TestFlight

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SCHEME: LifeRoute
      PROJECT: LifeRoute.xcodeproj
      BUNDLE_ID: Com.Brandongood.LifeRoute
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare LifeRoute app icon
        run: |
          python3 -m venv "$RUNNER_TEMP/liferoute-icon-venv"
          source "$RUNNER_TEMP/liferoute-icon-venv/bin/activate"
          python -m pip install --quiet --upgrade pip pillow
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image

          encoded = Path("LifeRoute/Web/liferoute-logo.b64").read_bytes()
          raw = base64.b64decode(encoded)
          image = Image.open(io.BytesIO(raw)).convert("RGB")
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)

          icon = Path("LifeRoute/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          logo = Path("LifeRoute/Web/liferoute-logo.png")
          icon.parent.mkdir(parents=True, exist_ok=True)
          logo.parent.mkdir(parents=True, exist_ok=True)

          image.save(icon, format="PNG", optimize=True)
          image.save(logo, format="PNG", optimize=True)

          check = Image.open(icon)
          assert check.format == "PNG", check.format
          assert check.size == (1024, 1024), check.size
          assert check.mode == "RGB", check.mode
          print(f"Prepared clean {check.size[0]}x{check.size[1]} RGB PNG app icon: {icon}")
          print(f"Prepared matching in-app LifeRoute logo: {logo}")
          PY

      - name: Validate required Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "Missing APP_STORE_CONNECT_KEY_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || (echo "Missing APP_STORE_CONNECT_PRIVATE_KEY" && exit 1)

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # altool searches this standard location for App Store Connect API keys.
          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_KEY_DIR"
          cp "$KEY_PATH" "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive LifeRoute
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LifeRoute.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/LifeRoute.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/export -name '*.ipa' -print -quit)
          test -n "$IPA" || (echo "No IPA found" && exit 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeRoute-TestFlight-build
          path: build/export/*.ipa
          if-no-files-found: ignore
