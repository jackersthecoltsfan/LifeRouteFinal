name: Send to TestFlight

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SCHEME: LifeRoute
      PROJECT: LifeRoute.xcodeproj
      BUNDLE_ID: Com.Brandongood.LifeRoute
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate LifeRoute app icon
        run: |
          set -euo pipefail
          ICON="LifeRoute/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          WEB_LOGO="LifeRoute/Web/liferoute-logo-source.png"
          SCRIPT="$RUNNER_TEMP/make_liferoute_icon.swift"
          mkdir -p "$(dirname "$ICON")" "$(dirname "$WEB_LOGO")"

          cat > "$SCRIPT" <<'SWIFT'
          import AppKit

          let output = CommandLine.arguments[1]
          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          let canvas = NSRect(origin: .zero, size: size)
          NSColor(calibratedRed: 0.018, green: 0.055, blue: 0.115, alpha: 1.0).setFill()
          canvas.fill()

          let inner = NSBezierPath(roundedRect: NSRect(x: 26, y: 26, width: 972, height: 972), xRadius: 180, yRadius: 180)
          NSColor(calibratedRed: 0.08, green: 0.19, blue: 0.35, alpha: 1.0).setStroke()
          inner.lineWidth = 10
          inner.stroke()

          let gold = NSColor(calibratedRed: 0.95, green: 0.70, blue: 0.20, alpha: 1.0)
          let goldHighlight = NSColor(calibratedRed: 1.0, green: 0.83, blue: 0.40, alpha: 1.0)
          let navy = NSColor(calibratedRed: 0.018, green: 0.055, blue: 0.115, alpha: 1.0)

          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .center
          let font = NSFont.systemFont(ofSize: 500, weight: .black)
          let shadow = NSShadow()
          shadow.shadowColor = NSColor.black.withAlphaComponent(0.45)
          shadow.shadowOffset = NSSize(width: 0, height: -16)
          shadow.shadowBlurRadius = 18

          let attrs: [NSAttributedString.Key: Any] = [
              .font: font,
              .foregroundColor: gold,
              .paragraphStyle: paragraph,
              .shadow: shadow
          ]
          ("LR" as NSString).draw(in: NSRect(x: 70, y: 210, width: 884, height: 590), withAttributes: attrs)

          let route = NSBezierPath()
          route.move(to: NSPoint(x: 452, y: 225))
          route.curve(to: NSPoint(x: 520, y: 440), controlPoint1: NSPoint(x: 635, y: 285), controlPoint2: NSPoint(x: 390, y: 360))
          goldHighlight.setStroke()
          route.lineWidth = 34
          route.lineCapStyle = .round
          route.stroke()

          let pinCenter = NSPoint(x: 520, y: 520)
          let pinCircle = NSBezierPath(ovalIn: NSRect(x: pinCenter.x - 66, y: pinCenter.y - 30, width: 132, height: 132))
          goldHighlight.setFill()
          pinCircle.fill()

          let tail = NSBezierPath()
          tail.move(to: NSPoint(x: 474, y: 510))
          tail.line(to: NSPoint(x: 520, y: 440))
          tail.line(to: NSPoint(x: 566, y: 510))
          tail.close()
          goldHighlight.setFill()
          tail.fill()

          let hole = NSBezierPath(ovalIn: NSRect(x: pinCenter.x - 25, y: pinCenter.y + 11, width: 50, height: 50))
          navy.setFill()
          hole.fill()

          image.unlockFocus()

          guard let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let png = bitmap.representation(using: .png, properties: [:]) else {
              fatalError("Could not encode LifeRoute icon as PNG")
          }
          try png.write(to: URL(fileURLWithPath: output))
          SWIFT

          swift "$SCRIPT" "$ICON"
          cp "$ICON" "$WEB_LOGO"

          test -s "$ICON" || (echo "LifeRoute app icon was not generated" && exit 1)
          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024" || (echo "Unexpected icon dimensions: ${WIDTH}x${HEIGHT}" && exit 1)
          file "$ICON"
          echo "Generated fresh 1024x1024 LifeRoute app icon and matching in-app logo."

      - name: Validate required Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "Missing APP_STORE_CONNECT_KEY_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || (echo "Missing APP_STORE_CONNECT_PRIVATE_KEY" && exit 1)

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_KEY_DIR"
          cp "$KEY_PATH" "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive LifeRoute
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LifeRoute.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/LifeRoute.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/export -name '*.ipa' -print -quit)
          test -n "$IPA" || (echo "No IPA found" && exit 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeRoute-TestFlight-build
          path: build/export/*.ipa
          if-no-files-found: ignore