name: Send to TestFlight

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      SCHEME: LifeRoute
      PROJECT: LifeRoute.xcodeproj
      BUNDLE_ID: Com.Brandongood.LifeRoute
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare LifeRoute app icon
        run: |
          set -euo pipefail
          ICON_SOURCE="$RUNNER_TEMP/LifeRouteLogo.jpg"
          ICON_OUTPUT="LifeRoute/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          WEB_LOGO="LifeRoute/Web/liferoute-logo.png"

          # The checked-in logo payload is base64 text. Normalize whitespace and
          # restore any omitted '=' padding before decoding it.
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          source = Path("LifeRoute/Web/liferoute-logo.b64")
          encoded = b"".join(source.read_bytes().split())
          encoded += b"=" * (-len(encoded) % 4)
          raw = base64.b64decode(encoded, validate=True)

          # The source artwork is JPEG data; verify it before handing it to sips.
          if not raw.startswith(b"\xff\xd8\xff"):
              raise SystemExit("LifeRoute logo payload did not decode to a valid JPEG")

          output = Path(os.environ["RUNNER_TEMP"]) / "LifeRouteLogo.jpg"
          output.write_bytes(raw)
          print(f"Decoded LifeRoute logo: {output} ({len(raw)} bytes)")
          PY

          mkdir -p "$(dirname "$ICON_OUTPUT")"
          mkdir -p "$(dirname "$WEB_LOGO")"

          # Convert the verified JPEG source to a real 1024x1024 PNG.
          sips -z 1024 1024 -s format png "$ICON_SOURCE" --out "$ICON_OUTPUT" >/dev/null
          cp "$ICON_OUTPUT" "$WEB_LOGO"

          test -s "$ICON_OUTPUT" || (echo "LifeRoute app icon was not generated" && exit 1)
          file "$ICON_OUTPUT"
          WIDTH=$(sips -g pixelWidth "$ICON_OUTPUT" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON_OUTPUT" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024" && test "$HEIGHT" = "1024" || (echo "Unexpected icon dimensions: ${WIDTH}x${HEIGHT}" && exit 1)
          echo "Prepared clean 1024x1024 PNG LifeRoute app icon and matching in-app logo."

      - name: Validate required Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APPLE_TEAM_ID" || (echo "Missing APPLE_TEAM_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "Missing APP_STORE_CONNECT_KEY_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "Missing APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || (echo "Missing APP_STORE_CONNECT_PRIVATE_KEY" && exit 1)

      - name: Prepare App Store Connect key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          # altool searches this standard location for App Store Connect API keys.
          ALTOOL_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ALTOOL_KEY_DIR"
          cp "$KEY_PATH" "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$ALTOOL_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive LifeRoute
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LifeRoute.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Create export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Export signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/LifeRoute.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/export -name '*.ipa' -print -quit)
          test -n "$IPA" || (echo "No IPA found" && exit 1)
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeRoute-TestFlight-build
          path: build/export/*.ipa
          if-no-files-found: ignore
