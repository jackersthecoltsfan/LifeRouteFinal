name: iOS Build Check
run-name: __APP_NAME__ build check · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - '__APP_SOURCE_PATH__/**'
      - '__PROJECT__/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '__APP_SOURCE_PATH__/**'
      - '__PROJECT__/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: __CONCURRENCY_PREFIX__-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the same features used by TestFlight
        run: bash scripts/prepare_build.sh

      - name: Prepare reusable __APP_NAME__ build scratch
        run: |
          set -euo pipefail
          scratch_root="$HOME/Library/Developer/LifeRouteBuilds"
          build_root="$scratch_root/__APP_NAME__/ios-ci"
          mkdir -p "$build_root"
          echo "LIFEROUTE_BUILD_SCRATCH_ROOT=$build_root" >> "$GITHUB_ENV"

      - name: Build __APP_NAME__ for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project "__PROJECT__" \
            -scheme "__SCHEME__" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$LIFEROUTE_BUILD_SCRATCH_ROOT/Debug-iphonesimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
